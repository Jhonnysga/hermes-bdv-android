name: Compilar APK debug

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Permiso gradlew
        run: chmod +x gradlew
      - name: Tests
        run: |
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/build.log; ec=${PIPESTATUS[0]}
          if [ $ec -ne 0 ]; then
            echo "=== EXTRAYENDO ERROR ==="
            grep -E "^e: |error:|FAILED|Execution failed" /tmp/build.log | head -20 > /tmp/errores.txt || true
            echo "::error::$(head -5 /tmp/errores.txt | tr '\n' ' ')"
            echo "--- contexto ---"
            grep -B2 -A8 "What went wrong" /tmp/build.log | head -30 || true
          fi
          exit $ec
      - name: Subir log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 1

  build:
    name: Compilar APK debug
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Permiso gradlew
        run: chmod +x gradlew
      - name: Compilar debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-bdv-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
