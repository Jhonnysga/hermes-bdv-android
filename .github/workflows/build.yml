name: Compilar APK debug

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Permiso gradlew
        run: chmod +x gradlew
      - name: Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}
      - name: Publicar error en Issue (si falla)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/build.log', 'utf8');
            // Extraer líneas con errores de Kotlin/Gradle
            const lineas = log.split('\n');
            const relevantes = lineas.filter(l =>
              l.includes('e: ') || l.includes('error:') ||
              l.includes('FAILED') || l.includes('Execution failed') ||
              l.includes('What went wrong:')
            ).slice(0, 40);
            const cuerpo = '```\n' + (relevantes.join('\n') || 'sin líneas de error identificadas') + '\n```\n\nCola del log:\n```\n' +
              lineas.slice(-30).join('\n') + '\n```';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Error CI: ' + context.sha.substring(0, 7),
              body: cuerpo
            });

  build:
    name: Compilar APK debug
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Permiso gradlew
        run: chmod +x gradlew
      - name: Compilar debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-bdv-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
